name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  dry-run-lint:
    name: Dry-run (production config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Snakemake
        run: pip install snakemake pandas

      - name: Create empty placeholders for external source files (needed only for the dry-run - --dry-run still checks that source files not produced by any rule actually exist, even though it never reads their content)
        run: |
          mkdir -p resources/DepMap/models resources/DepMap/probabilities resources/DepMap/scores
          touch resources/DepMap/models/Model.csv
          touch resources/DepMap/probabilities/CRISPRGeneDependency.csv
          touch resources/DepMap/scores/CRISPRGeneEffect.csv
          mkdir -p resources/IntOGen/IntOGen-Drivers-20240920
          touch resources/IntOGen/IntOGen-Drivers-20240920/Compendium_Cancer_Genes.tsv
          mkdir -p resources/COSMIC/classification/Cosmic_Classification_Tsv_v103_GRCh38
          mkdir -p resources/COSMIC/samples/Cosmic_Sample_Tsv_v103_GRCh38
          mkdir -p resources/COSMIC/mutations/coding/Cosmic_GenomeScreensMutant_Tsv_v103_GRCh38
          mkdir -p resources/COSMIC/mutations/noncoding/Cosmic_NonCodingVariants_Tsv_v103_GRCh38
          touch resources/COSMIC/classification/Cosmic_Classification_Tsv_v103_GRCh38/Cosmic_Classification_v103_GRCh38.tsv
          touch resources/COSMIC/samples/Cosmic_Sample_Tsv_v103_GRCh38/Cosmic_Sample_v103_GRCh38.tsv
          touch resources/COSMIC/mutations/coding/Cosmic_GenomeScreensMutant_Tsv_v103_GRCh38/Cosmic_GenomeScreensMutant_v103_GRCh38.tsv
          touch resources/COSMIC/mutations/noncoding/Cosmic_NonCodingVariants_Tsv_v103_GRCh38/Cosmic_NonCodingVariants_v103_GRCh38.tsv
          mkdir -p resources/GDC/CNAs/clinical.cohort.2026-01-28
          touch resources/GDC/CNAs/clinical.cohort.2026-01-28/clinical.tsv
          touch resources/GDC/CNAs/gdc_sample_sheet.2026-01-28.tsv
          touch resources/GDC/CNAs/gdc_manifest.2026-01-28.170055.txt
          mkdir -p resources/GDC/CNAs/files/dummy
          touch resources/GDC/CNAs/files/dummy/dummy.seg.v2.txt
          mkdir -p resources/fragile_sites/origin resources/ohnologs_and_paralogs/origin resources/haploinsufficiency resources/epigenomes
          touch resources/fragile_sites/origin/fragile_sites_li_hg38.bed
          touch resources/ohnologs_and_paralogs/origin/OhnologList.RData resources/ohnologs_and_paralogs/origin/ParalogList.RData
          mkdir -p resources/protein_interactions/origin
          touch resources/protein_interactions/origin/HumanPCgenes_Subunits_allchr.RData resources/protein_interactions/origin/H_sapiens_interfacesHQ_genename.RData
          touch resources/haploinsufficiency/haploinsufficiency.csv
          # get_counts_atacseq.smk declares two bare (non-wildcarded) DIRECTORIES as `input:` -
          # resources/atacseq/files/coverage and resources/atacseq/files/cnvkit - used internally
          # by its R script to glob per-sample files. No rule produces exactly those bare paths
          # (only wildcarded files INSIDE them), so --dry-run/--rulegraph treat them the same as
          # any other missing source file (confirmed: MissingInputException otherwise, seen on a
          # real CI run before this line was added).
          mkdir -p resources/atacseq/files/coverage resources/atacseq/files/cnvkit
          touch resources/epigenomes/mapping_EID_tt_raw.tsv

      - name: Dry-run on the entire production DAG
        run: |
          snakemake -n -s workflow/snakefile_dataset_bin_level --configfile config/config_dataset_BRCA.yaml

      - name: Assembly guard (only hg38 accepted; hg19 is work in progress)
        # Same production config with assembly_codes switched to hg19 / hg18: the snakefile
        # must refuse both at parse time with an explicit error instead of building a DAG
        # that would place GRCh38 COSMIC / GDC coordinates on hg19 bins.
        run: |
          for asm in hg19 hg18; do
            sed "s/^ - hg38$/ - $asm/" config/config_dataset_BRCA.yaml > /tmp/config_dataset_$asm.yaml
            grep -A1 '^assembly_codes' /tmp/config_dataset_$asm.yaml | grep -q "$asm"
            if snakemake -n -s workflow/snakefile_dataset_bin_level --configfile /tmp/config_dataset_$asm.yaml > /tmp/guard_$asm.log 2>&1; then
              echo "assembly_code $asm was accepted, expected an error"; exit 1
            fi
            grep -q "assembly_code '$asm' is not supported" /tmp/guard_$asm.log \
              || { tail -20 /tmp/guard_$asm.log; echo "wrong failure for $asm"; exit 1; }
          done
          echo "OK: hg19 and hg18 refused with an explicit error"

      - name: Distance-cap guard (dist_caps is config-only, not a wildcard)
        # A second value would silently be ignored (the rule uses dist_caps[0]) and, since the
        # cap is not in the file names, could not be told apart downstream: it must fail at parse time.
        run: |
          sed "s/^  - 1000000$/  - 1000000\n  - 500000/" config/config_dataset_BRCA.yaml > /tmp/config_dataset_two_caps.yaml
          [ "$(grep -A2 '^dist_caps' /tmp/config_dataset_two_caps.yaml | grep -c '^  - ')" -eq 2 ]
          if snakemake -n -s workflow/snakefile_dataset_bin_level --configfile /tmp/config_dataset_two_caps.yaml > /tmp/guard_caps.log 2>&1; then
            echo "two dist_caps were accepted, expected an error"; exit 1
          fi
          grep -q "dist_caps is a config-only parameter" /tmp/guard_caps.log \
            || { tail -20 /tmp/guard_caps.log; echo "wrong failure for two dist_caps"; exit 1; }
          echo "OK: two dist_caps refused with an explicit error"

  unit-tests:
    name: Unit test on R scripts (toy data, no snakemake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python packages (numpy/pandas needed directly by test_hic_scripts.sh,
              which exercises process_hic.py's Python logic via a subprocess; cooler needed
              by the same script's new normalize_matrix_hic.py test, which builds a real toy
              2-chromosome .cool file to verify the per-chromosome cis-only fetch; scikit-learn/
              scikit-optimize/xgboost/shap needed by test_ml_scripts.sh; snakemake needed by
              test_GTEx_scripts.sh, which runs the real download rule against a local HTTP server)
        run: pip install numpy pandas scipy scikit-learn scikit-optimize xgboost shap joblib seaborn matplotlib cooler snakemake --break-system-packages

      - name: Install R + bedtools + bwa + bowtie2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-dplyr r-cran-magrittr r-cran-r.utils \
            r-bioc-genomicranges r-bioc-rtracklayer r-cran-tidyr r-cran-ggplot2 r-cran-gridextra r-cran-tibble r-bioc-edger r-bioc-sva r-bioc-dnacopy bedtools bwa bowtie2 samtools trim-galore picard-tools sra-toolkit
          # Ubuntu's picard-tools package ships "PicardCommandLine", not "picard" (the
          # command name the real conda "picard" package - and this pipeline's rules -
          # expect). Shim it so the rules work unmodified.
          echo -e '#!/bin/bash\nexec PicardCommandLine "$@"' | sudo tee /usr/local/bin/picard > /dev/null
          sudo chmod +x /usr/local/bin/picard

      - name: Sanity-check that all required command-line tools are actually on PATH
        run: |
          for tool in Rscript bedtools bwa bowtie2 bowtie2-build trim_galore fastq-dump prefetch picard samtools; do
            if ! command -v "$tool" > /dev/null 2>&1; then
              echo "ERROR: '$tool' is not on PATH after installation - the apt-get install step"
              echo "above may have silently failed to install it (e.g. a dependency conflict) or"
              echo "the package providing it may no longer be named/available as expected on this"
              echo "runner image. Check the 'Install R + bedtools + bwa + bowtie2' step's full"
              echo "output above for warnings/errors about this specific package."
              exit 1
            fi
          done
          echo "OK: all required tools are on PATH ($(bwa 2>&1 | head -3 | tail -1))"

      - name: Unit-testing
        run: |
          bash .tests/unit/test_backbone_scripts.sh
          bash .tests/unit/test_depmap_scripts.sh
          bash .tests/unit/test_intogen_scripts.sh
          bash .tests/unit/test_epigenomes_scripts.sh
          bash .tests/unit/test_cosmic_scripts.sh
          bash .tests/unit/test_gdc_scripts.sh
          bash .tests/unit/test_fragile_sites_scripts.sh
          bash .tests/unit/test_ohnologs_paralogs_scripts.sh
          bash .tests/unit/gencode_annotation_rule.sh
          bash .tests/unit/protein_interactions_scripts.sh
          bash .tests/unit/test_GTEx_scripts.sh
          bash .tests/unit/test_gene_density_haploinsufficiency_scripts.sh
          bash .tests/unit/test_genome_scripts.sh
          bash .tests/unit/test_explore_datatypes_scripts.sh
          bash .tests/unit/test_combine_dataset_scripts.sh
          bash .tests/unit/test_cap_distance_feature_scripts.sh
          bash .tests/unit/test_repliseq_scripts.sh
          bash .tests/unit/test_atacseq_scripts.sh
          bash .tests/unit/test_hic_scripts.sh
          bash .tests/unit/test_ml_scripts.sh
          bash .tests/unit/test_ml_hyperparams_scripts.sh
          bash .tests/unit/test_conda_env_declarations.sh

  toy-integration-test:
    name: Integration testing (toy data, backbone/DepMap/IntOGen modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Snakemake
        run: pip install snakemake pandas

      - name: Install CNVkit (needed for the ATAC-seq module's copy-number scaling step)
        run: pip install cnvkit --break-system-packages

      - name: Install pairtools, cooler, multiqc, samblaster (needed for the Hi-C module)
        run: |
          pip install pairtools cooler multiqc --break-system-packages
          sudo apt-get install -y --no-install-recommends samblaster

      - name: Install R + bedtools + bwa + bowtie2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-dplyr r-cran-magrittr r-cran-r.utils \
            r-bioc-genomicranges r-bioc-rtracklayer r-cran-tidyr r-cran-ggplot2 r-cran-gridextra r-bioc-edger r-bioc-sva r-bioc-dnacopy bedtools bwa bowtie2 samtools trim-galore picard-tools sra-toolkit
          # Ubuntu's picard-tools package ships "PicardCommandLine", not "picard" (the
          # command name the real conda "picard" package - and this pipeline's rules -
          # expect). Shim it so the rules work unmodified.
          echo -e '#!/bin/bash\nexec PicardCommandLine "$@"' | sudo tee /usr/local/bin/picard > /dev/null
          sudo chmod +x /usr/local/bin/picard

      - name: Sanity-check that all required command-line tools are actually on PATH
        run: |
          for tool in Rscript bedtools bwa bowtie2 bowtie2-build trim_galore fastq-dump prefetch picard samtools cnvkit.py samblaster pairtools cooler multiqc; do
            if ! command -v "$tool" > /dev/null 2>&1; then
              echo "ERROR: '$tool' is not on PATH after installation - the apt-get install step"
              echo "above may have silently failed to install it (e.g. a dependency conflict) or"
              echo "the package providing it may no longer be named/available as expected on this"
              echo "runner image. Check the 'Install R + bedtools + bwa + bowtie2' step's full"
              echo "output above for warnings/errors about this specific package."
              exit 1
            fi
          done
          echo "OK: all required tools are on PATH ($(bwa 2>&1 | head -3 | tail -1))"

      - name: Copy toy fixtures into the paths expected by the rules (bypasses real downloads)
        run: |
          # Note: the Snakefile already creates an empty directory skeleton under resources/
          # at parse time (side-effect of the mkdir calls at the top of the file), so we use
          # "src/." to copy the CONTENT without nesting resources/resources/...
          mkdir -p resources
          cp -r .tests/integration/data/resources/. ./resources/
          # Toy CORUM / Interactome INSIDER / GTEx inputs built from the toy GENCODE genes (no
          # binary fixtures committed; no upstream rule, so no timestamp-ordering issue)
          Rscript .tests/integration/make_toy_GTEx_interactor_inputs.R \
            resources/reference_data/gencode/gencode.v1.annotation.gff3.gz \
            config/mapping_GTEx_TCGA resources
          # "cp -r" does not guarantee timestamp ordering between files copied in the same
          # command. get_blacklisted_regions has an input (chrom_sizes), and Snakemake compares
          # mtimes: if chrom_sizes happened to end up newer than blacklist.bed, Snakemake would
          # consider it stale and attempt the real download anyway. We explicitly fix the order
          # (chrom_sizes/cytobands/gencode first, then blacklist, the only "mock-download" file
          # with an input of its own).
          touch resources/reference_data/chrom_sizes/hg00.chrom.sizes
          touch resources/reference_data/cytobands/hg00_cytoBand.txt
          touch resources/reference_data/gencode/gencode.v1.annotation.gff3.gz
          touch resources/reference_data/gencode/gencode.v1.annotation.gtf.gz
          sleep 1
          touch resources/blacklist/hg00.bed
          # Same timestamp-ordering issue as above, but for the Roadmap epigenomes checkpoint
          # chain: get_mapping_EID_tt (checkpoint, no input) -> get_epigenome_paths (input:
          # the checkpoint's output) -> get_epigenome_files (input: the paths file). Order
          # them oldest-to-newest so none of them is considered stale.
          touch resources/epigenomes/mapping_EID_tt.tsv
          sleep 1
          touch resources/epigenomes/checks/paths/BREAST_PrimaryCulture_noliftover_mnemonics
          sleep 1
          touch resources/epigenomes/checks/downloads/BREAST_PrimaryCulture_noliftover_mnemonics
          touch resources/epigenomes/roadmap/E027_12_coreMarks_mnemonics.bed
          # get_reference_genome has no input, so no ordering issue - just make sure it's
          # already present so the (real, network-dependent) download is skipped.
          touch resources/reference_data/genome/hg00.fa
          # Same timestamp-ordering issue as above, for the RepliSeq prefetch->fastq_dump
          # chain: pre-seed the (fake) .sra files older than the (fake) FASTQ files they
          # would "produce", so fastq_dump_repliseq isn't considered stale and doesn't try
          # a real prefetch_repliseq download.
          find resources/repliseq -type f -exec touch -d '2020-01-01' {} \;
          find resources/atacseq -type f -exec touch -d '2020-01-01' {} \;
          find resources/hic -type f -exec touch -d '2020-01-01' {} \;
          sleep 1
          touch resources/repliseq/files/fastq/SRR9001/SRR9001_1.fastq.gz resources/repliseq/files/fastq/SRR9001/SRR9001_2.fastq.gz
          touch resources/repliseq/files/fastq/SRR9002/SRR9002_1.fastq.gz resources/repliseq/files/fastq/SRR9002/SRR9002_2.fastq.gz
          touch resources/repliseq/files/fastq/SRR9003/SRR9003_1.fastq.gz resources/repliseq/files/fastq/SRR9003/SRR9003_2.fastq.gz
          for sid in SRR1001 SRR1002 SRR1003 SRR1004 SRR2001 SRR2002 SRR2003 SRR2004; do
            touch resources/atacseq/files/fastq/$sid/${sid}_1.fastq.gz resources/atacseq/files/fastq/$sid/${sid}_2.fastq.gz
          done
          touch resources/hic/files/fastq/SRR3001/SRR3001_1.fastq.gz resources/hic/files/fastq/SRR3001/SRR3001_2.fastq.gz
          touch resources/hic/files/fastq/SRR3002/SRR3002_1.fastq.gz resources/hic/files/fastq/SRR3002/SRR3002_2.fastq.gz

      - name: Execute pipeline on toy data (fake hg00 assembly) - part 1 (up to the GDC
              manifest, so gdc-client's real download can be bypassed with a fresh-enough
              timestamp afterwards)
        run: |
          snakemake -s workflow/snakefile_dataset_bin_level \
            --configfile .tests/integration/config/config_dataset.yaml \
            --cores 2 -p \
            resources/GDC/CNAs/BRCA_female_manifest

      - name: Mark the gdc-client download step as already done (no network access to the
              real GDC servers in CI; toy CNA segment files are pre-placed under
              .tests/integration/data/resources/GDC/CNAs/files/)
        run: |
          mkdir -p resources/GDC/CNAs/checks
          touch resources/GDC/CNAs/checks/BRCA_female

      - name: Build the backbone first, then bypass get_GC_content/process_GC_content (real
              BSgenome package needed, not available for a fake assembly)
        run: |
          snakemake -s workflow/snakefile_dataset_bin_level \
            --configfile .tests/integration/config/config_dataset.yaml \
            --cores 2 -p \
            resources/backbone/hg00_binned_200_0.mask.filtered.sorted.bed
          # NOTE: this must run AFTER the backbone is actually built above, not before - if
          # pre-seeded too early, Snakemake sees the freshly-(re)built backbone as newer than
          # these bypass files and tries to run the real (BSgenome-dependent) rules anyway,
          # confirmed by a real failure in this exact spot when seeded prematurely.
          mkdir -p resources/GC data/GC
          printf "chr1\t0\t200\t1_1\t0.51\nchr1\t200\t400\t1_2\t0.49\n" > resources/GC/hg00_binned_200_0
          printf "binID\tGC.content\n1_1\t0.51\n1_2\t0.49\n" > data/GC/hg00_binned_200_0

      - name: Execute pipeline on toy data (fake hg00 assembly) - part 2
        run: |
          snakemake -s workflow/snakefile_dataset_bin_level \
            --configfile .tests/integration/config/config_dataset.yaml \
            --cores 2 -p \
            data/distances/centromeres/hg00_binned_200_0 \
            data/distances/telomeres/hg00_binned_200_0 \
            data/num_overlaps/PC/hg00_binned_200_0_v1 \
            data/num_overlaps/lncRNA/hg00_binned_200_0_v1 \
            data/num_overlaps/miRNA/hg00_binned_200_0_v1 \
            data/num_overlaps/rRNA/hg00_binned_200_0_v1 \
            data/distances/PC/hg00_binned_200_0_v1 \
            data/distances/lncRNA/hg00_binned_200_0_v1 \
            data/distances/miRNA/hg00_binned_200_0_v1 \
            data/distances/rRNA/hg00_binned_200_0_v1 \
            resources/backbone/hg00_binned_200_0_v1.genes_on_bins.RData \
            data/distances/essential/hg00_binned_200_0_BRCA_Female_0.5_1_v1 \
            data/num_overlaps/essential/BRCA_Female_0.5_1_v1_hg00_binned_200_0 \
            data/distances/TSG/hg00_binned_200_0_v1_BRCA \
            data/distances/OG/hg00_binned_200_0_v1_BRCA \
            data/epigenomes/BREAST_PrimaryCulture_noliftover_mnemonics_hg00_binned_200_0 \
            data/num_overlaps/mutations/coding/hg00_binned_200_0_f_breast_carcinoma \
            data/num_overlaps/mutations/noncoding/hg00_binned_200_0_f_breast_carcinoma \
            data/num_overlaps/CNAs/ampl/hg00_binned_200_0_BRCA_female_50_0.2 \
            data/num_overlaps/CNAs/del/hg00_binned_200_0_BRCA_female_50_0.2 \
            data/distances/fragile_sites/hg00_binned_200_0 \
            data/num_overlaps/fragile_sites/hg00_binned_200_0 \
            data/ohnologs_and_paralogs/ohnologs/hg00_binned_200_0_v1 \
            data/ohnologs_and_paralogs/paralogs/hg00_binned_200_0_v1 \
            data/protein_interactions/hg00_binned_200_0_v1 \
            data/GTEx/features/hg00_binned_200_0_v1_BRCA_v8 \
            resources/num_overlaps/density/essential/hg00_binned_200_0_BRCA_Female_0.5_1_v1_BRCA \
            resources/num_overlaps/density/OG/hg00_binned_200_0_BRCA_Female_0.5_1_v1_BRCA \
            resources/num_overlaps/density/TSG/hg00_binned_200_0_BRCA_Female_0.5_1_v1_BRCA \
            data/haploinsufficiency/hg00_binned_200_0_v1_0.9 \
            resources/reference_data/genome/hg00.fa.bwt \
            resources/reference_data/genome/hg00.1.bt2 \
            data/repliseq/hg00_binned_200_0_20_0_500000_MCF10A \
            "results/plots/atacseq/exploratory/samples_barplot/hg00_binned_200_0_20_2_1_1_1_BRCA_Female_BRCA_female_f_breast_carcinoma.pdf" \
            "data/atacseq/hg00_binned_200_0_20_2_1_1_1_BRCA_female_50_0.2" \
            "data/hic/hg00_20_binned_200_0_MCF10A.eigen" \
            "data/feature_matrix/hg00_binned_200_0_20_0_500000_MCF10A_MCF10A_2_1_1_1_BRCA_female_50_0.2_f_breast_carcinoma_BRCA_Female_0.5_1_v1_BREAST_PrimaryCulture_noliftover_mnemonics_BRCA_0.9_BRCA_v8"
          # NOTE: data/GC/... itself is deliberately excluded from this test's target list:
          # get_GC_content.R requires the Bioconductor BSgenome package specific to the real
          # assembly (e.g. BSgenome.Hsapiens.UCSC.hg38, ~800MB) and can therefore not be tested
          # with a fake assembly. It is validated separately (syntax check + process_GC_content.R
          # tested with toy data, see .tests/unit). Both its raw and final outputs are pre-seeded
          # above (bypassing get_GC_content/process_GC_content entirely) purely so
          # combine_dataset - which does need data/GC/... as one of its ~27 inputs - can still
          # be tested end-to-end.

      - name: Verify outputs are not empty
        run: |
          set -e
          for f in \
            data/distances/centromeres/hg00_binned_200_0 \
            data/distances/telomeres/hg00_binned_200_0 \
            data/num_overlaps/PC/hg00_binned_200_0_v1 \
            data/distances/PC/hg00_binned_200_0_v1 \
            resources/backbone/hg00_binned_200_0_v1.genes_on_bins.RData \
            data/distances/essential/hg00_binned_200_0_BRCA_Female_0.5_1_v1 \
            data/num_overlaps/essential/BRCA_Female_0.5_1_v1_hg00_binned_200_0 \
            data/distances/TSG/hg00_binned_200_0_v1_BRCA \
            data/distances/OG/hg00_binned_200_0_v1_BRCA \
            data/epigenomes/BREAST_PrimaryCulture_noliftover_mnemonics_hg00_binned_200_0 \
            data/num_overlaps/mutations/coding/hg00_binned_200_0_f_breast_carcinoma \
            data/num_overlaps/mutations/noncoding/hg00_binned_200_0_f_breast_carcinoma \
            data/num_overlaps/CNAs/ampl/hg00_binned_200_0_BRCA_female_50_0.2 \
            data/num_overlaps/CNAs/del/hg00_binned_200_0_BRCA_female_50_0.2 \
            data/distances/fragile_sites/hg00_binned_200_0 \
            data/num_overlaps/fragile_sites/hg00_binned_200_0 \
            data/ohnologs_and_paralogs/ohnologs/hg00_binned_200_0_v1 \
            data/ohnologs_and_paralogs/paralogs/hg00_binned_200_0_v1 \
            data/protein_interactions/hg00_binned_200_0_v1 \
            data/GTEx/features/hg00_binned_200_0_v1_BRCA_v8 \
            resources/num_overlaps/density/essential/hg00_binned_200_0_BRCA_Female_0.5_1_v1_BRCA \
            resources/num_overlaps/density/OG/hg00_binned_200_0_BRCA_Female_0.5_1_v1_BRCA \
            resources/num_overlaps/density/TSG/hg00_binned_200_0_BRCA_Female_0.5_1_v1_BRCA \
            data/haploinsufficiency/hg00_binned_200_0_v1_0.9 \
            resources/reference_data/genome/hg00.fa.bwt \
            resources/reference_data/genome/hg00.1.bt2 \
            data/repliseq/hg00_binned_200_0_20_0_500000_MCF10A \
            "results/plots/atacseq/exploratory/samples_barplot/hg00_binned_200_0_20_2_1_1_1_BRCA_Female_BRCA_female_f_breast_carcinoma.pdf" \
            "data/atacseq/hg00_binned_200_0_20_2_1_1_1_BRCA_female_50_0.2" \
            "data/hic/hg00_20_binned_200_0_MCF10A.eigen" \
            "data/feature_matrix/hg00_binned_200_0_20_0_500000_MCF10A_MCF10A_2_1_1_1_BRCA_female_50_0.2_f_breast_carcinoma_BRCA_Female_0.5_1_v1_BREAST_PrimaryCulture_noliftover_mnemonics_BRCA_0.9_BRCA_v8" ; do
            test -s "$f" || { echo "Missing or empty file: $f"; exit 1; }
          done
          echo "OK: all expected outputs are present and non-empty"
          # The toy CORUM/INSIDER/GTEx inputs are built from the toy GENCODE genes, so the
          # features must not be all-NA (that would mean genes never matched across files)
          Rscript -e 'g <- read.delim("data/GTEx/features/hg00_binned_200_0_v1_BRCA_v8"); stopifnot(nrow(g) > 0, any(!is.na(g$GTEx_genes))); i <- read.delim("data/protein_interactions/hg00_binned_200_0_v1"); stopifnot(nrow(i) > 0, any(i$complex_density > 0))' \
            || { echo "GTEx / protein-interaction features are empty or all-NA on toy data"; exit 1; }
          echo "OK: GTEx / protein-interaction features contain matched genes"

      - name: Verify distance capping (rule cap_distance_feature, dist_caps = 1000 bp in the toy
              config) - capped copies exist for every listed feature, keep the raw binIDs and NAs,
              never exceed the cap, and are what the feature matrix actually contains;
              centromere/telomere distances (not listed) are not capped
        run: |
          set -e
          CAP=1000
          for f in \
            OG/hg00_binned_200_0_v1_BRCA \
            TSG/hg00_binned_200_0_v1_BRCA \
            essential/hg00_binned_200_0_BRCA_Female_0.5_1_v1 \
            fragile_sites/hg00_binned_200_0 \
            PC/hg00_binned_200_0_v1 \
            lncRNA/hg00_binned_200_0_v1 \
            miRNA/hg00_binned_200_0_v1 \
            rRNA/hg00_binned_200_0_v1 ; do
            test -s "data/distances_capped/$f" || { echo "Missing or empty capped file: $f"; exit 1; }
            test -s "results/plots/dataset/distances_capped/$f.pdf" || { echo "Missing or empty diagnostic plot: $f"; exit 1; }
            Rscript -e "raw <- read.delim('data/distances/$f'); cap <- read.delim('data/distances_capped/$f'); \
                        stopifnot(identical(raw\$binID, cap\$binID), identical(is.na(raw[[2]]), is.na(cap[[2]])), \
                                  all(cap[[2]] <= $CAP, na.rm = TRUE), all(cap[[2]] == pmin(raw[[2]], $CAP), na.rm = TRUE))" \
              || { echo "Capping is wrong for $f"; exit 1; }
          done
          [ ! -e data/distances_capped/centromeres ] && [ ! -e data/distances_capped/telomeres ] \
            || { echo "centromere/telomere distances were capped, but they are not listed in capped_distance_features"; exit 1; }
          Rscript -e "m <- read.delim('data/feature_matrix/hg00_binned_200_0_20_0_500000_MCF10A_MCF10A_2_1_1_1_BRCA_female_50_0.2_f_breast_carcinoma_BRCA_Female_0.5_1_v1_BREAST_PrimaryCulture_noliftover_mnemonics_BRCA_0.9_BRCA_v8'); \
                      stopifnot(all(m\$dist.to.closest.OG <= $CAP, na.rm = TRUE), all(m\$dist.to.closest.gene_protein_coding <= $CAP, na.rm = TRUE))" \
            || { echo "The feature matrix does not contain the capped distances"; exit 1; }
          echo "OK: distance features capped at $CAP bp, NAs and binIDs preserved, capped values used in the feature matrix"

      - name: Verify the Hi-C cis-only per-chromosome chain ran correctly (checkpoint +
              {chrom} wildcard, added 2026-09) - not just that the final aggregated file
              exists, but that it was genuinely built from exactly the chromosomes the
              clean_chrom_sizes checkpoint should have produced for the hg00 toy assembly
              (chr1, chr2 - chrX/chrM are filtered out by clean_chrom_sizes' own grep, same
              as before this change)
        run: |
          set -e
          test -s "data/hic/hg00_20_binned_200_0_MCF10A_chr1.eigen" || { echo "Missing per-chromosome eigen file for chr1"; exit 1; }
          test -s "data/hic/hg00_20_binned_200_0_MCF10A_chr2.eigen" || { echo "Missing per-chromosome eigen file for chr2"; exit 1; }
          N_CHROM_FILES=$(ls data/hic/hg00_20_binned_200_0_MCF10A_chr*.eigen | wc -l)
          [ "$N_CHROM_FILES" -eq 2 ] || { echo "Expected exactly 2 per-chromosome eigen files (chr1, chr2), found $N_CHROM_FILES - the clean_chrom_sizes checkpoint may have resolved an unexpected chromosome list"; exit 1; }
          # the aggregated genome-wide file's data rows must equal the sum of the two
          # per-chromosome files' data rows (header-deduplicated concatenation, not a
          # coincidental byte-for-byte copy of just one of them)
          N_AGG_DATA_ROWS=$(($(wc -l < "data/hic/hg00_20_binned_200_0_MCF10A.eigen") - 1))
          N_CHR1_DATA_ROWS=$(($(wc -l < "data/hic/hg00_20_binned_200_0_MCF10A_chr1.eigen") - 1))
          N_CHR2_DATA_ROWS=$(($(wc -l < "data/hic/hg00_20_binned_200_0_MCF10A_chr2.eigen") - 1))
          [ "$N_AGG_DATA_ROWS" -eq "$((N_CHR1_DATA_ROWS + N_CHR2_DATA_ROWS))" ] || { echo "Aggregated file's row count ($N_AGG_DATA_ROWS) != chr1 ($N_CHR1_DATA_ROWS) + chr2 ($N_CHR2_DATA_ROWS)"; exit 1; }
          echo "OK: Hi-C cis-only per-chromosome checkpoint chain produced exactly chr1+chr2, correctly aggregated"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snakemake-logs
          path: |
            logs/
            .snakemake/log/

  ml-toy-integration-test:
    name: Toy integration test - ML pipeline (snakefile_ML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Snakemake and ML dependencies
        run: |
          pip install snakemake pandas numpy scipy statsmodels scikit-learn scikit-optimize xgboost shap joblib seaborn matplotlib --break-system-packages

      - name: Install R + visualization packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-dplyr r-cran-tidyr r-cran-tibble r-cran-ggplot2 r-cran-magrittr r-cran-r.utils r-cran-tidyselect r-cran-gridextra

      - name: Sanity-check that all required tools are actually on PATH
        run: |
          for tool in Rscript; do
            if ! command -v "$tool" > /dev/null 2>&1; then
              echo "ERROR: '$tool' is not on PATH after installation"
              exit 1
            fi
          done
          python3 -c "import scipy, sklearn, skopt, xgboost, shap, joblib, seaborn, matplotlib; print('OK: ML python deps import correctly')"
          Rscript -e 'library(R.utils); library(dplyr); library(tidyr); library(tibble); library(ggplot2); library(magrittr); library(tidyselect); library(gridExtra); cat("OK: ML R deps load correctly\n")'

      - name: Run snakefile_ML end-to-end on a toy dataset (fake feature matrix, small
              model/blocking selection, small CV/iteration counts for speed)
        run: |
          snakemake -s workflow/snakefile_ML \
            --configfile .tests/integration/config/config_ML.yaml \
            --cores 2 -p

      - name: Verify all expected outputs exist and are non-empty
        run: |
          for chrom in 1 2 3; do
            # consensus_features.tsv can legitimately be empty (0 bytes) - it's valid for no
            # single feature to be selected in more than half the outer folds, especially with
            # this toy dataset's small fold count; only existence is checked for this one file.
            test -f "results/ML/toy_dataset/per_chrom/$chrom/target/logFC/best_model/consensus_features.tsv" \
              || { echo "Missing file: results/ML/toy_dataset/per_chrom/$chrom/target/logFC/best_model/consensus_features.tsv"; exit 1; }
            for f in \
              "results/ML/toy_dataset/per_chrom/$chrom/target/logFC/best_model/best_model_name.txt" \
              "results/ML/toy_dataset/per_chrom/$chrom/target/logFC/best_model/consensus_hyperparams.tsv" \
              "results/ML/toy_dataset/per_chrom/$chrom/target/logFC/plots/selfeats_heatmap.pdf" \
              "results/ML/toy_dataset/per_chrom/$chrom/target/logFC/plots/performance_heatmap.pdf" \
              "results/ML/toy_dataset/per_chrom/$chrom/target/logFC/plots/median_boxplots.pdf" \
              "results/ML/toy_dataset/per_chrom/$chrom/target/logFC/plots/hyperparams_table.pdf" ; do
              test -s "$f" || { echo "Missing or empty file: $f"; exit 1; }
            done
          done
          echo "OK: all expected ML pipeline outputs are present, for every chromosome"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ml-snakemake-logs
          path: |
            logs/
            .snakemake/log/