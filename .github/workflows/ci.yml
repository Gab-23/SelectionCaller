name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  dry-run-lint:
    name: Dry-run (production config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Snakemake
        run: pip install snakemake pandas

      - name: Create empty placeholders for external source files (needed only for the dry-run - --dry-run still checks that source files not produced by any rule actually exist, even though it never reads their content)
        run: |
          mkdir -p resources/DepMap/models resources/DepMap/probabilities resources/DepMap/scores
          touch resources/DepMap/models/Model.csv
          touch resources/DepMap/probabilities/CRISPRGeneDependency.csv
          touch resources/DepMap/scores/CRISPRGeneEffect.csv
          mkdir -p resources/IntOGen/IntOGen-Drivers-20240920
          touch resources/IntOGen/IntOGen-Drivers-20240920/Compendium_Cancer_Genes.tsv
          mkdir -p resources/COSMIC/classification/Cosmic_Classification_Tsv_v103_GRCh38
          mkdir -p resources/COSMIC/samples/Cosmic_Sample_Tsv_v103_GRCh38
          mkdir -p resources/COSMIC/mutations/coding/Cosmic_GenomeScreensMutant_Tsv_v103_GRCh38
          mkdir -p resources/COSMIC/mutations/noncoding/Cosmic_NonCodingVariants_Tsv_v103_GRCh38
          touch resources/COSMIC/classification/Cosmic_Classification_Tsv_v103_GRCh38/Cosmic_Classification_v103_GRCh38.tsv
          touch resources/COSMIC/samples/Cosmic_Sample_Tsv_v103_GRCh38/Cosmic_Sample_v103_GRCh38.tsv
          touch resources/COSMIC/mutations/coding/Cosmic_GenomeScreensMutant_Tsv_v103_GRCh38/Cosmic_GenomeScreensMutant_v103_GRCh38.tsv
          touch resources/COSMIC/mutations/noncoding/Cosmic_NonCodingVariants_Tsv_v103_GRCh38/Cosmic_NonCodingVariants_v103_GRCh38.tsv
          mkdir -p resources/GDC/CNAs/clinical.cohort.2026-01-28
          touch resources/GDC/CNAs/clinical.cohort.2026-01-28/clinical.tsv
          touch resources/GDC/CNAs/gdc_sample_sheet.2026-01-28.tsv
          touch resources/GDC/CNAs/gdc_manifest.2026-01-28.170055.txt
          mkdir -p resources/GDC/CNAs/files/dummy
          touch resources/GDC/CNAs/files/dummy/dummy.seg.v2.txt
          mkdir -p resources/fragile_sites/origin resources/ohnologs_and_paralogs/origin resources/haploinsufficiency
          touch resources/fragile_sites/origin/fragile_sites_li_hg38.bed
          touch resources/ohnologs_and_paralogs/origin/OhnologList.RData resources/ohnologs_and_paralogs/origin/ParalogList.RData
          touch resources/haploinsufficiency/haploinsufficiency.csv

      - name: Dry-run on the entire production DAG
        run: |
          snakemake -n -s workflow/snakefile_bin_level --configfile config/config.yaml

  unit-tests:
    name: Unit test on R scripts (toy data, no snakemake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python packages (numpy/pandas needed directly by test_hic_scripts.sh,
              which exercises process_hic.py's Python logic via a subprocess)
        run: pip install numpy pandas --break-system-packages

      - name: Install R + bedtools + bwa + bowtie2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-dplyr r-cran-magrittr r-cran-r.utils \
            r-bioc-genomicranges r-bioc-rtracklayer r-cran-tidyr r-cran-ggplot2 r-cran-gridextra r-bioc-edger r-bioc-sva r-bioc-dnacopy bedtools bwa bowtie2 samtools trim-galore picard-tools sra-toolkit
          # Ubuntu's picard-tools package ships "PicardCommandLine", not "picard" (the
          # command name the real conda "picard" package - and this pipeline's rules -
          # expect). Shim it so the rules work unmodified.
          echo -e '#!/bin/bash\nexec PicardCommandLine "$@"' | sudo tee /usr/local/bin/picard > /dev/null
          sudo chmod +x /usr/local/bin/picard

      - name: Sanity-check that all required command-line tools are actually on PATH
        run: |
          for tool in Rscript bedtools bwa bowtie2 bowtie2-build trim_galore fastq-dump prefetch picard samtools; do
            if ! command -v "$tool" > /dev/null 2>&1; then
              echo "ERROR: '$tool' is not on PATH after installation - the apt-get install step"
              echo "above may have silently failed to install it (e.g. a dependency conflict) or"
              echo "the package providing it may no longer be named/available as expected on this"
              echo "runner image. Check the 'Install R + bedtools + bwa + bowtie2' step's full"
              echo "output above for warnings/errors about this specific package."
              exit 1
            fi
          done
          echo "OK: all required tools are on PATH ($(bwa 2>&1 | head -3 | tail -1))"

      - name: Unit-testing
        run: |
          bash .tests/unit/test_backbone_scripts.sh
          bash .tests/unit/test_depmap_scripts.sh
          bash .tests/unit/test_intogen_scripts.sh
          bash .tests/unit/test_epigenomes_scripts.sh
          bash .tests/unit/test_cosmic_scripts.sh
          bash .tests/unit/test_gdc_scripts.sh
          bash .tests/unit/test_fragile_sites_scripts.sh
          bash .tests/unit/test_ohnologs_paralogs_scripts.sh
          bash .tests/unit/test_gene_density_haploinsufficiency_scripts.sh
          bash .tests/unit/test_genome_scripts.sh
          bash .tests/unit/test_explore_datatypes_scripts.sh
          bash .tests/unit/test_combine_dataset_scripts.sh
          bash .tests/unit/test_repliseq_scripts.sh
          bash .tests/unit/test_atacseq_scripts.sh
          bash .tests/unit/test_hic_scripts.sh

  toy-integration-test:
    name: Integration testing (toy data, backbone/DepMap/IntOGen modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Snakemake
        run: pip install snakemake pandas

      - name: Install CNVkit (needed for the ATAC-seq module's copy-number scaling step)
        run: pip install cnvkit --break-system-packages

      - name: Install pairtools, cooler, multiqc, samblaster (needed for the Hi-C module)
        run: |
          pip install pairtools cooler multiqc --break-system-packages
          sudo apt-get install -y --no-install-recommends samblaster

      - name: Install R + bedtools + bwa + bowtie2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-dplyr r-cran-magrittr r-cran-r.utils \
            r-bioc-genomicranges r-bioc-rtracklayer r-cran-tidyr r-cran-ggplot2 r-cran-gridextra r-bioc-edger r-bioc-sva r-bioc-dnacopy bedtools bwa bowtie2 samtools trim-galore picard-tools sra-toolkit
          # Ubuntu's picard-tools package ships "PicardCommandLine", not "picard" (the
          # command name the real conda "picard" package - and this pipeline's rules -
          # expect). Shim it so the rules work unmodified.
          echo -e '#!/bin/bash\nexec PicardCommandLine "$@"' | sudo tee /usr/local/bin/picard > /dev/null
          sudo chmod +x /usr/local/bin/picard

      - name: Sanity-check that all required command-line tools are actually on PATH
        run: |
          for tool in Rscript bedtools bwa bowtie2 bowtie2-build trim_galore fastq-dump prefetch picard samtools cnvkit.py samblaster pairtools cooler multiqc; do
            if ! command -v "$tool" > /dev/null 2>&1; then
              echo "ERROR: '$tool' is not on PATH after installation - the apt-get install step"
              echo "above may have silently failed to install it (e.g. a dependency conflict) or"
              echo "the package providing it may no longer be named/available as expected on this"
              echo "runner image. Check the 'Install R + bedtools + bwa + bowtie2' step's full"
              echo "output above for warnings/errors about this specific package."
              exit 1
            fi
          done
          echo "OK: all required tools are on PATH ($(bwa 2>&1 | head -3 | tail -1))"

      - name: Copy toy fixtures into the paths expected by the rules (bypasses real downloads)
        run: |
          # Note: the Snakefile already creates an empty directory skeleton under resources/
          # at parse time (side-effect of the mkdir calls at the top of the file), so we use
          # "src/." to copy the CONTENT without nesting resources/resources/...
          mkdir -p resources
          cp -r .tests/integration/data/resources/. ./resources/
          # "cp -r" does not guarantee timestamp ordering between files copied in the same
          # command. get_blacklisted_regions has an input (chrom_sizes), and Snakemake compares
          # mtimes: if chrom_sizes happened to end up newer than blacklist.bed, Snakemake would
          # consider it stale and attempt the real download anyway. We explicitly fix the order
          # (chrom_sizes/cytobands/gencode first, then blacklist, the only "mock-download" file
          # with an input of its own).
          touch resources/reference_data/chrom_sizes/hg00.chrom.sizes
          touch resources/reference_data/cytobands/hg00_cytoBand.txt
          touch resources/reference_data/gencode/gencode.v1.annotation.gff3.gz
          touch resources/reference_data/gencode/gencode.v1.annotation.gtf.gz
          sleep 1
          touch resources/blacklist/hg00.bed
          # Same timestamp-ordering issue as above, but for the Roadmap epigenomes checkpoint
          # chain: get_mapping_EID_tt (checkpoint, no input) -> get_epigenome_paths (input:
          # the checkpoint's output) -> get_epigenome_files (input: the paths file). Order
          # them oldest-to-newest so none of them is considered stale.
          touch resources/epigenomes/mapping_EID_tt.tsv
          sleep 1
          touch resources/epigenomes/checks/paths/BREAST_PrimaryCulture_noliftover_mnemonics
          sleep 1
          touch resources/epigenomes/checks/downloads/BREAST_PrimaryCulture_noliftover_mnemonics
          touch resources/epigenomes/roadmap/E027_12_coreMarks_mnemonics.bed
          # get_reference_genome has no input, so no ordering issue - just make sure it's
          # already present so the (real, network-dependent) download is skipped.
          touch resources/reference_data/genome/hg00.fa
          # Same timestamp-ordering issue as above, for the RepliSeq prefetch->fastq_dump
          # chain: pre-seed the (fake) .sra files older than the (fake) FASTQ files they
          # would "produce", so fastq_dump_repliseq isn't considered stale and doesn't try
          # a real prefetch_repliseq download.
          find resources/repliseq -type f -exec touch -d '2020-01-01' {} \;
          find resources/atacseq -type f -exec touch -d '2020-01-01' {} \;
          find resources/hic -type f -exec touch -d '2020-01-01' {} \;
          sleep 1
          touch resources/repliseq/files/fastq/SRR9001/SRR9001_1.fastq.gz resources/repliseq/files/fastq/SRR9001/SRR9001_2.fastq.gz
          touch resources/repliseq/files/fastq/SRR9002/SRR9002_1.fastq.gz resources/repliseq/files/fastq/SRR9002/SRR9002_2.fastq.gz
          touch resources/repliseq/files/fastq/SRR9003/SRR9003_1.fastq.gz resources/repliseq/files/fastq/SRR9003/SRR9003_2.fastq.gz
          for sid in SRR1001 SRR1002 SRR1003 SRR1004 SRR2001 SRR2002 SRR2003 SRR2004; do
            touch resources/atacseq/files/fastq/$sid/${sid}_1.fastq.gz resources/atacseq/files/fastq/$sid/${sid}_2.fastq.gz
          done
          touch resources/hic/files/fastq/SRR3001/SRR3001_1.fastq.gz resources/hic/files/fastq/SRR3001/SRR3001_2.fastq.gz
          touch resources/hic/files/fastq/SRR3002/SRR3002_1.fastq.gz resources/hic/files/fastq/SRR3002/SRR3002_2.fastq.gz

      - name: Execute pipeline on toy data (fake hg00 assembly) - part 1 (up to the GDC
              manifest, so gdc-client's real download can be bypassed with a fresh-enough
              timestamp afterwards)
        run: |
          snakemake -s workflow/snakefile_bin_level \
            --configfile .tests/integration/config/config.yaml \
            --cores 2 -p \
            resources/GDC/CNAs/BRCA_female_manifest

      - name: Mark the gdc-client download step as already done (no network access to the
              real GDC servers in CI; toy CNA segment files are pre-placed under
              .tests/integration/data/resources/GDC/CNAs/files/)
        run: |
          mkdir -p resources/GDC/CNAs/checks
          touch resources/GDC/CNAs/checks/BRCA_female

      - name: Build the backbone first, then bypass get_GC_content/process_GC_content (real
              BSgenome package needed, not available for a fake assembly)
        run: |
          snakemake -s workflow/snakefile_bin_level \
            --configfile .tests/integration/config/config.yaml \
            --cores 2 -p \
            resources/backbone/hg00_binned_200_0.mask.filtered.sorted.bed
          # NOTE: this must run AFTER the backbone is actually built above, not before - if
          # pre-seeded too early, Snakemake sees the freshly-(re)built backbone as newer than
          # these bypass files and tries to run the real (BSgenome-dependent) rules anyway,
          # confirmed by a real failure in this exact spot when seeded prematurely.
          mkdir -p resources/GC data/GC
          printf "chr1\t0\t200\t1_1\t0.51\nchr1\t200\t400\t1_2\t0.49\n" > resources/GC/hg00_binned_200_0
          printf "binID\tGC.content\n1_1\t0.51\n1_2\t0.49\n" > data/GC/hg00_binned_200_0

      - name: Execute pipeline on toy data (fake hg00 assembly) - part 2
        run: |
          snakemake -s workflow/snakefile_bin_level \
            --configfile .tests/integration/config/config.yaml \
            --cores 2 -p \
            data/distances/centromeres/hg00_binned_200_0 \
            data/distances/telomeres/hg00_binned_200_0 \
            data/num_overlaps/PC/hg00_binned_200_0_v1 \
            data/num_overlaps/lncRNA/hg00_binned_200_0_v1 \
            data/num_overlaps/miRNA/hg00_binned_200_0_v1 \
            data/num_overlaps/rRNA/hg00_binned_200_0_v1 \
            data/distances/PC/hg00_binned_200_0_v1 \
            data/distances/lncRNA/hg00_binned_200_0_v1 \
            data/distances/miRNA/hg00_binned_200_0_v1 \
            data/distances/rRNA/hg00_binned_200_0_v1 \
            resources/backbone/hg00_binned_200_0_v1.genes_on_bins.RData \
            data/distances/essential/hg00_binned_200_0_BRCA_Female_0.5_1_v1 \
            data/num_overlaps/essential/BRCA_Female_0.5_1_v1_hg00_binned_200_0 \
            data/distances/TSG/hg00_binned_200_0_v1_BRCA \
            data/distances/OG/hg00_binned_200_0_v1_BRCA \
            data/epigenomes/BREAST_PrimaryCulture_noliftover_mnemonics_hg00_binned_200_0 \
            data/num_overlaps/mutations/coding/hg00_binned_200_0_f_breast_carcinoma \
            data/num_overlaps/mutations/noncoding/hg00_binned_200_0_f_breast_carcinoma \
            data/num_overlaps/CNAs/ampl/hg00_binned_200_0_BRCA_female_50_0.2 \
            data/num_overlaps/CNAs/del/hg00_binned_200_0_BRCA_female_50_0.2 \
            data/distances/fragile_sites/hg00_binned_200_0 \
            data/num_overlaps/fragile_sites/hg00_binned_200_0 \
            data/ohnologs_and_paralogs/ohnologs/hg00_binned_200_0_v1 \
            data/ohnologs_and_paralogs/paralogs/hg00_binned_200_0_v1 \
            resources/num_overlaps/density/essential/hg00_binned_200_0_BRCA_Female_0.5_1_v1_BRCA \
            resources/num_overlaps/density/OG/hg00_binned_200_0_BRCA_Female_0.5_1_v1_BRCA \
            resources/num_overlaps/density/TSG/hg00_binned_200_0_BRCA_Female_0.5_1_v1_BRCA \
            data/haploinsufficiency/hg00_binned_200_0_v1_0.9 \
            resources/reference_data/genome/hg00.fa.bwt \
            resources/reference_data/genome/hg00.1.bt2 \
            data/repliseq/hg00_binned_200_0_20_0_500000 \
            "results/plots/atacseq/exploratory/samples_per_study/hg00_binned_200_0_20_2_1_1_1.pdf" \
            "data/atacseq/hg00_binned_200_0_20_2_1_1_1_BRCA_female_50_0.2" \
            "data/hic/hg00_20_binned_200_0.eigen" \
            "data/feature_matrix/hg00_binned_200_0_20_0_500000_2_1_1_1_BRCA_female_50_0.2_f_breast_carcinoma_BRCA_Female_0.5_1_v1_BREAST_PrimaryCulture_noliftover_mnemonics_BRCA_0.9"
          # NOTE: data/GC/... itself is deliberately excluded from this test's target list:
          # get_GC_content.R requires the Bioconductor BSgenome package specific to the real
          # assembly (e.g. BSgenome.Hsapiens.UCSC.hg38, ~800MB) and can therefore not be tested
          # with a fake assembly. It is validated separately (syntax check + process_GC_content.R
          # tested with toy data, see .tests/unit). Both its raw and final outputs are pre-seeded
          # above (bypassing get_GC_content/process_GC_content entirely) purely so
          # combine_dataset - which does need data/GC/... as one of its ~27 inputs - can still
          # be tested end-to-end.

      - name: Verify outputs are not empty
        run: |
          set -e
          for f in \
            data/distances/centromeres/hg00_binned_200_0 \
            data/distances/telomeres/hg00_binned_200_0 \
            data/num_overlaps/PC/hg00_binned_200_0_v1 \
            data/distances/PC/hg00_binned_200_0_v1 \
            resources/backbone/hg00_binned_200_0_v1.genes_on_bins.RData \
            data/distances/essential/hg00_binned_200_0_BRCA_Female_0.5_1_v1 \
            data/num_overlaps/essential/BRCA_Female_0.5_1_v1_hg00_binned_200_0 \
            data/distances/TSG/hg00_binned_200_0_v1_BRCA \
            data/distances/OG/hg00_binned_200_0_v1_BRCA \
            data/epigenomes/BREAST_PrimaryCulture_noliftover_mnemonics_hg00_binned_200_0 \
            data/num_overlaps/mutations/coding/hg00_binned_200_0_f_breast_carcinoma \
            data/num_overlaps/mutations/noncoding/hg00_binned_200_0_f_breast_carcinoma \
            data/num_overlaps/CNAs/ampl/hg00_binned_200_0_BRCA_female_50_0.2 \
            data/num_overlaps/CNAs/del/hg00_binned_200_0_BRCA_female_50_0.2 \
            data/distances/fragile_sites/hg00_binned_200_0 \
            data/num_overlaps/fragile_sites/hg00_binned_200_0 \
            data/ohnologs_and_paralogs/ohnologs/hg00_binned_200_0_v1 \
            data/ohnologs_and_paralogs/paralogs/hg00_binned_200_0_v1 \
            resources/num_overlaps/density/essential/hg00_binned_200_0_BRCA_Female_0.5_1_v1_BRCA \
            resources/num_overlaps/density/OG/hg00_binned_200_0_BRCA_Female_0.5_1_v1_BRCA \
            resources/num_overlaps/density/TSG/hg00_binned_200_0_BRCA_Female_0.5_1_v1_BRCA \
            data/haploinsufficiency/hg00_binned_200_0_v1_0.9 \
            resources/reference_data/genome/hg00.fa.bwt \
            resources/reference_data/genome/hg00.1.bt2 \
            data/repliseq/hg00_binned_200_0_20_0_500000 \
            "results/plots/atacseq/exploratory/samples_per_study/hg00_binned_200_0_20_2_1_1_1.pdf" \
            "data/atacseq/hg00_binned_200_0_20_2_1_1_1_BRCA_female_50_0.2" \
            "data/hic/hg00_20_binned_200_0.eigen" \
            "data/feature_matrix/hg00_binned_200_0_20_0_500000_2_1_1_1_BRCA_female_50_0.2_f_breast_carcinoma_BRCA_Female_0.5_1_v1_BREAST_PrimaryCulture_noliftover_mnemonics_BRCA_0.9" ; do
            test -s "$f" || { echo "Missing or empty file: $f"; exit 1; }
          done
          echo "OK: all expected outputs are present and non-empty"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snakemake-logs
          path: |
            logs/
            .snakemake/log/