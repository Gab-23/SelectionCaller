name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  dry-run-lint:
    name: Dry-run (config di produzione)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Snakemake
        run: pip install snakemake pandas

      - name: Dry-run sull'intera DAG di produzione
        run: |
          snakemake -n -s workflow/snakefile_bin_level --configfile config/config.yaml

  unit-tests:
    name: Unit test sugli script R (dati toy, senza Snakemake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install R + bedtools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-dplyr r-cran-magrittr r-cran-r.utils \
            r-bioc-genomicranges r-bioc-rtracklayer bedtools

      - name: Esegui gli unit test
        run: bash .tests/unit/test_backbone_scripts.sh

  toy-integration-test:
    name: Test di integrazione (dati toy, modulo backbone/annotazioni)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Snakemake
        run: pip install snakemake

      - name: Install R + bedtools (via apt, per un test rapido senza conda)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-dplyr r-cran-magrittr r-cran-r.utils \
            r-bioc-genomicranges r-bioc-rtracklayer bedtools

      - name: Copia le fixture toy nei percorsi attesi dalle regole (bypassa i download reali)
        run: |
          # Nota: lo Snakefile crea gia' uno scheletro di cartelle vuote in resources/ al
          # parsing (side-effect dei mkdir in testa al file), quindi usiamo "src/." per
          # copiare il CONTENUTO senza annidare resources/resources/...
          mkdir -p resources
          cp -r .tests/integration/data/resources/. ./resources/

      - name: Esegui la pipeline sui dati toy (assembly fittizio hg00)
        run: |
          snakemake -s workflow/snakefile_bin_level \
            --configfile .tests/integration/config/config.yaml \
            --cores 2 -p \
            data/distances/centromeres/hg00_binned_200_0 \
            data/distances/telomeres/hg00_binned_200_0 \
            data/num_overlaps/PC/hg00_binned_200_0_v1 \
            data/num_overlaps/lncRNA/hg00_binned_200_0_v1 \
            data/num_overlaps/miRNA/hg00_binned_200_0_v1 \
            data/num_overlaps/rRNA/hg00_binned_200_0_v1 \
            data/distances/PC/hg00_binned_200_0_v1 \
            data/distances/lncRNA/hg00_binned_200_0_v1 \
            data/distances/miRNA/hg00_binned_200_0_v1 \
            data/distances/rRNA/hg00_binned_200_0_v1 \
            resources/backbone/hg00_binned_200_0_v1.genes_on_bins.RData
          # NOTA: data/GC/... e' escluso di proposito da questo test: get_GC_content.R
          # richiede il pacchetto Bioconductor BSgenome specifico dell'assembly reale
          # (es. BSgenome.Hsapiens.UCSC.hg38, ~800MB) e non e' quindi testabile con un
          # assembly fittizio. E' validato separatamente (sintassi + process_GC_content.R
          # con dati toy, si veda .tests/unit).

      - name: Verifica che gli output non siano vuoti
        run: |
          set -e
          for f in \
            data/distances/centromeres/hg00_binned_200_0 \
            data/distances/telomeres/hg00_binned_200_0 \
            data/num_overlaps/PC/hg00_binned_200_0_v1 \
            data/distances/PC/hg00_binned_200_0_v1 \
            resources/backbone/hg00_binned_200_0_v1.genes_on_bins.RData ; do
            test -s "$f" || { echo "File vuoto o mancante: $f"; exit 1; }
          done
          echo "OK: tutti gli output attesi sono presenti e non vuoti"

      - name: Upload log in caso di fallimento
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snakemake-logs
          path: |
            logs/
            .snakemake/log/
