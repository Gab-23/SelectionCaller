name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  dry-run-lint:
    name: Dry-run (production config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Snakemake
        run: pip install snakemake pandas

      - name: Dry-run on the entire production DAG
        run: |
          snakemake -n -s workflow/snakefile_bin_level --configfile config/config.yaml

  unit-tests:
    name: Unit test on R scripts (toy data, no snakemake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install R + bedtools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-dplyr r-cran-magrittr r-cran-r.utils \
            r-bioc-genomicranges r-bioc-rtracklayer bedtools

      - name: Unit-testing
        run: bash .tests/unit/test_backbone_scripts.sh

  toy-integration-test:
    name: Integration testing (Toy data, backbone module/annotations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Snakemake
        run: pip install snakemake pandas

      - name: Install R + bedtools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            r-base-core r-cran-dplyr r-cran-magrittr r-cran-r.utils \
            r-bioc-genomicranges r-bioc-rtracklayer bedtools

      - name: Copy fixture toy in paths expected by rules (bypasses real downloads)
        run: |
          
          mkdir -p resources
          cp -r .tests/integration/data/resources/. ./resources/
          touch resources/reference_data/chrom_sizes/hg00.chrom.sizes
          touch resources/reference_data/cytobands/hg00_cytoBand.txt
          touch resources/reference_data/gencode/gencode.v1.annotation.gff3.gz
          touch resources/reference_data/gencode/gencode.v1.annotation.gtf.gz
          sleep 1
          touch resources/blacklist/hg00.bed

      - name: Execute pipeline on toy data (fake hg00 assembly)
        run: |
          snakemake -s workflow/snakefile_bin_level \
            --configfile .tests/integration/config/config.yaml \
            --cores 2 -p \
            data/distances/centromeres/hg00_binned_200_0 \
            data/distances/telomeres/hg00_binned_200_0 \
            data/num_overlaps/PC/hg00_binned_200_0_v1 \
            data/num_overlaps/lncRNA/hg00_binned_200_0_v1 \
            data/num_overlaps/miRNA/hg00_binned_200_0_v1 \
            data/num_overlaps/rRNA/hg00_binned_200_0_v1 \
            data/distances/PC/hg00_binned_200_0_v1 \
            data/distances/lncRNA/hg00_binned_200_0_v1 \
            data/distances/miRNA/hg00_binned_200_0_v1 \
            data/distances/rRNA/hg00_binned_200_0_v1 \
            resources/backbone/hg00_binned_200_0_v1.genes_on_bins.RData

      - name: Verify outputs are not empty
        run: |
          set -e
          for f in \
            data/distances/centromeres/hg00_binned_200_0 \
            data/distances/telomeres/hg00_binned_200_0 \
            data/num_overlaps/PC/hg00_binned_200_0_v1 \
            data/distances/PC/hg00_binned_200_0_v1 \
            resources/backbone/hg00_binned_200_0_v1.genes_on_bins.RData ; do
            test -s "$f" || { echo "File vuoto o mancante: $f"; exit 1; }
          done
          echo "OK: tutti gli output attesi sono presenti e non vuoti"

      - name: Upload log in case of failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snakemake-logs
          path: |
            logs/
            .snakemake/log/