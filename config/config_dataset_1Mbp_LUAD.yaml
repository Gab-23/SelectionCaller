COSMIC_coding_locations:
  - "resources/COSMIC/mutations/coding/Cosmic_GenomeScreensMutant_Tsv_v103_GRCh38/Cosmic_GenomeScreensMutant_v103_GRCh38.tsv"

# Campioni ipermutati: esclusi se hanno piu' di questo numero di eventi CODIFICANTI
# (campione x mutazione, sostituzioni e indel) nel file COSMIC filtrato. "none" = nessuna esclusione.
# 3000 = criterio di Martincorena et al. 2017 (> 3000 mutazioni codificanti per campione).
# Config-only (non entra nei nomi dei file): dopo un cambio usare --forcerun compute_coding_mutations_counts.
COSMIC_hypermutator_max_mutations:
  - "3000"

# Trascritti usati per la classe delle mutazioni (mut_n_syn / mut_n_mis / mut_n_trunc / mut_n_other_coding):
# "canonical" = trascritto con tag Ensembl_canonical nel GTF di GENCODE (gencode_versions);
# "all" = classe piu' grave tra tutti i trascritti.
# Config-only (non entra nei nomi dei file): dopo un cambio usare --forcerun compute_coding_mutations_counts.
COSMIC_transcript_mode:
  - "canonical"

COSMIC_noncoding_locations:
  - "resources/COSMIC/mutations/noncoding/Cosmic_NonCodingVariants_Tsv_v103_GRCh38/Cosmic_NonCodingVariants_v103_GRCh38.tsv"

COSMIC_event_annotation:
  - "reference"

