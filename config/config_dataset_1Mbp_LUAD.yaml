q_val_thr_atacseqs:
  - 1

num_cores_Rs:
  - 10

# Distance features: cap (bp) applied symmetrically around each locus, per chromosome (rule
# cap_distance_feature). Config-only, NOT a wildcard: exactly one value, not encoded in file names.
dist_caps:
  - 10000000

# data/distances/<subfolder> names of the distance features to cap. centromeres and telomeres can be
# added too (same file format), but they are meant to encode large-scale position.
capped_distance_features:
  - OG
  - TSG
  - essential
  - fragile_sites
  - PC
  - lncRNA
  - miRNA
  - rRNA

GC_correction_atacseqs:
  - "loess"        # "none" = come adesso
  
GC_span_atacseqs:
  - 0.3            # più alto = curva più liscia

GC_n_fit_atacseqs:
  - 20000          # bin usati per stimare ogni curva

blacklist_max_fraction:
  - "0.5"
# NOTE (29/10/2026): input del dataset esclusi (parametro solo da config): nessun ATAC tumore vs normale per il polmone
dataset_excluded_inputs:
  - DARs
