input_path_datasets:
  - ".tests/integration/data/resources/ML/toy_dataset.tsv"
input_path_is_autocorrelated: ".tests/integration/data/resources/ML/IS_AUTOCORRELATED"
input_path_is_multicollinear: ".tests/integration/data/resources/ML/IS_MULTICOLLINEAR"
input_path_models: ".tests/integration/data/resources/ML/MODELS"
selected_models:
  - "LinearRegression"
  - "XGBRegressor"
input_path_blockings: ".tests/integration/data/resources/ML/BLOCKINGS"
selected_blockings:
  - "5"
# The CI verify step checks results/ML/toy_dataset/per_chrom/{1,2,3}/..., so per_chrom only
training_modes:
  - "per_chrom"
test_sizes:
  - 0.2
outer_cvs:
  - 2
inner_cvs:
  - 2
optimizers:
  - "RandomSearchCV"
n_iters:
  - 3
n_jobs_MLs:
  - 1
model_n_jobs_MLs:
  - 1
bin_size_bp: 200
fdr_thresholds:
  - 0.1
target_cols:
  - "logFC"
# Same as production: "FDR" is not a column of the toy dataset either, so the toy run takes
# the same "absent column -> warning, ignored" path as the production configs
cols_to_exclude:
  - "FDR"